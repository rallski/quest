<title>Quest</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Layout: schmale Navigationsleiste links, Arbeitsfläche rechts; dunkel zuerst, eine warme Akzentfarbe für „Quest-Stunden“ */
:root{
  --bg:#0f1012; --panel:#16171a; --raised:#1c1d21; --line:#26282d; --line-2:#33363c;
  --fg:#ececee; --muted:#8b8d94; --faint:#5d6068;
  --accent:#f2b84b; --accent-ink:#1a1408; --accent-soft:rgba(242,184,75,.12);
  --good:#7fcf8a; --danger:#f07a6a; --other:#4a4d55;
  --sans:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'Geist Mono',ui-monospace,'SF Mono',Consolas,monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#f6f6f4; --panel:#ffffff; --raised:#f0f0ed; --line:#e4e4df; --line-2:#d4d4ce;
  --fg:#18191b; --muted:#6b6d72; --faint:#a2a4a8;
  --accent:#b87a12; --accent-ink:#ffffff; --accent-soft:rgba(184,122,18,.1);
  --good:#2f8a3e; --danger:#c2412f; --other:#c9cac6; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#f6f6f4; --panel:#ffffff; --raised:#f0f0ed; --line:#e4e4df; --line-2:#d4d4ce;
  --fg:#18191b; --muted:#6b6d72; --faint:#a2a4a8;
  --accent:#b87a12; --accent-ink:#ffffff; --accent-soft:rgba(184,122,18,.1);
  --good:#2f8a3e; --danger:#c2412f; --other:#c9cac6; color-scheme:light}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.num,.meta,.clock,kbd{font-variant-numeric:tabular-nums}

.shell{display:grid;grid-template-columns:224px minmax(0,1fr);min-height:100vh}
aside{border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:20px;position:sticky;top:0;height:100vh;overflow:auto;background:var(--panel)}
main{padding-block:26px 100px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-width:0}
@media (min-width:861px){main{padding-left:max(36px,env(safe-area-inset-left,0px));padding-right:max(36px,env(safe-area-inset-right,0px))}}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:20px}
.brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:16px;padding:2px 8px;letter-spacing:-.01em}
.brand svg{width:20px;height:20px}
.nav{display:grid;gap:1px}
.nav button{display:flex;justify-content:space-between;align-items:center;border:0;background:none;padding:7px 9px;border-radius:7px;cursor:pointer;color:var(--muted);text-align:left}
.nav button:hover{background:var(--raised);color:var(--fg)}
.nav button.on{background:var(--raised);color:var(--fg)}
kbd{font-family:var(--mono);font-size:10.5px;color:var(--faint);border:1px solid var(--line-2);border-radius:4px;padding:0 4px;line-height:16px}
.label{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.meta{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.muted{color:var(--muted)}
.side-block{display:grid;gap:6px;padding:0 8px}
.side-q{display:flex;align-items:center;gap:8px;font-size:13px;cursor:pointer;padding:3px 0}
.side-q .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
.side-q:hover .t{color:var(--fg)}
.side-foot{margin-top:auto;display:grid;gap:6px;font-size:12px;color:var(--muted);padding:0 8px}
.dot{width:8px;height:8px;border-radius:50%;flex:0 0 auto;display:inline-block;background:var(--qc,var(--other))}
.prog{height:5px;background:var(--raised);border-radius:9px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:9px}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
h1{font-size:clamp(22px,3vw,28px);font-weight:600;letter-spacing:-.02em;margin:2px 0 0;text-wrap:balance}
h2{font-size:15px;font-weight:600;margin:0;letter-spacing:-.01em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:20px;align-items:start}
.stack{display:grid;gap:16px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.btn{border:1px solid var(--line-2);background:var(--raised);padding:6px 12px;border-radius:8px;cursor:pointer;font-weight:500;white-space:nowrap;font-size:13px}
.btn:hover{border-color:var(--faint)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--fg);background:var(--raised)}
.btn.sm{padding:3px 8px;font-size:12px;border-radius:6px}
.btn.danger{color:var(--danger)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:none;padding:5px 11px;cursor:pointer;color:var(--muted);font-size:13px}
.seg button.on{background:var(--raised);color:var(--fg)}
.field{width:100%;padding:8px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--bg)}
textarea.field{resize:vertical;line-height:1.5}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:500;color:var(--qc,var(--muted));background:color-mix(in srgb,var(--qc,var(--muted)) 14%,transparent);padding:1px 7px 1px 6px;border-radius:99px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--qc,var(--muted));flex:0 0 auto}

/* Aufgaben */
.tlist{display:grid;gap:4px}
.task{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:9px;background:var(--raised);border:1px solid transparent;cursor:grab;min-width:0}
.task:hover{border-color:var(--line-2)}
.task.drag-over{border-color:var(--accent);border-style:dashed}
.task.dragging{opacity:.4}
.task .body{flex:1;min-width:0;cursor:pointer;display:grid;gap:2px}
.task .t{overflow-wrap:anywhere}
.task.done{background:none;cursor:default}
.task.done .t{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--faint)}
.task .acts{display:flex;gap:2px;opacity:0}
.task:hover .acts,.task:focus-within .acts{opacity:1}
@media (hover:none){.task .acts{opacity:1}}
.task.first{background:var(--accent-soft);border-color:color-mix(in srgb,var(--accent) 35%,transparent);padding:12px}
.task.first .t{font-weight:500;font-size:15px}
.check{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--faint);background:none;cursor:pointer;flex:0 0 auto;display:grid;place-items:center;padding:0}
.check svg{width:11px;height:11px}
.check path{stroke:var(--bg);stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20}
.check:hover{border-color:var(--good)}
.check.on{background:var(--good);border-color:var(--good)}
.check.on path{stroke-dashoffset:0}
.task.completing .check{background:var(--good);border-color:var(--good);animation:pop .35s ease}
.task.completing .check path{stroke-dashoffset:0;transition:stroke-dashoffset .3s ease .05s}
.task.completing{animation:fadeout .4s ease .45s forwards}
@keyframes pop{40%{transform:scale(1.25)}}
@keyframes fadeout{to{opacity:.3}}
.addline{display:flex;gap:8px;margin-top:10px}
.addline input{flex:1;min-width:0}
.addline select{max-width:38%}
.fold{display:flex;align-items:center;gap:6px;border:0;background:none;color:var(--muted);cursor:pointer;padding:4px 0;font:inherit}
.fold svg{width:10px;height:10px;transition:transform .15s}
.fold.open svg{transform:rotate(90deg)}
.empty{color:var(--muted);padding:12px 4px;font-size:13px}

/* Plan */
.week{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:8px;overflow-x:auto;padding-bottom:6px}
.col{display:flex;flex-direction:column;gap:5px;min-height:280px;border-radius:10px;padding:4px;border:1px dashed transparent}
.col.drag-over{border-color:var(--accent)}
.col.past{opacity:.55}
.col-head{display:flex;justify-content:space-between;align-items:baseline;padding:4px 6px 8px;border-bottom:2px solid var(--line);margin-bottom:4px}
.col.today .col-head{border-bottom-color:var(--accent)}
.col-head b{font-weight:600;font-size:13px}
.col input{font-size:12.5px;padding:6px 8px;border:1px solid var(--line);background:var(--panel);border-radius:7px;width:100%}
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 9px;display:grid;gap:6px;cursor:grab;font-size:12.5px;position:relative}
.pcard::before{content:"";position:absolute;left:0;top:8px;bottom:8px;width:2px;border-radius:2px;background:var(--qc,transparent)}
.pcard:hover{border-color:var(--line-2)}
.pcard .t{overflow-wrap:anywhere;hyphens:auto;cursor:pointer;line-height:1.35}
.pcard .foot{display:flex;align-items:center;gap:6px;justify-content:space-between}
.pcard.done{opacity:.45;cursor:default}
.pcard.done .t{text-decoration:line-through}
.pcard.drag-over{border-color:var(--accent);border-style:dashed}
.pcard .check{width:15px;height:15px}
.pcard .check svg{width:9px;height:9px}
.backlog .tlist{grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}

/* Kalender / Logbuch */
.tl-wrap{overflow-x:auto}
.tl{display:grid;gap:0 6px;min-width:0}
.tl-head{font-size:12px;padding:0 2px 8px;display:flex;justify-content:space-between;gap:4px}
.tl-head b{font-weight:600}
.tl-hours{position:relative}
.tl-hours span{position:absolute;right:6px;transform:translateY(-50%);font-family:var(--mono);font-size:10.5px;color:var(--faint)}
.tl-col{position:relative;border-radius:8px;background-color:var(--panel);background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--pph));border:1px solid var(--line)}
.blk{position:absolute;left:3px;right:3px;border:0;border-radius:5px;padding:3px 6px;text-align:left;cursor:pointer;overflow:hidden;background:color-mix(in srgb,var(--qc) 22%,var(--panel));border-left:3px solid var(--qc);display:grid;align-content:start;gap:0;font-size:11.5px;line-height:1.25;color:var(--fg)}
.blk:hover{background:color-mix(in srgb,var(--qc) 32%,var(--panel))}
.blk b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.blk span{font-family:var(--mono);font-size:10px;color:var(--muted)}
.blk.run{background-image:repeating-linear-gradient(135deg,transparent 0 6px,color-mix(in srgb,var(--qc) 18%,transparent) 6px 12px);cursor:default}
.now{position:absolute;left:0;right:0;height:2px;background:var(--danger);z-index:2}
.now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--danger)}

/* Fokus */
.focus{min-height:calc(100vh - 160px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:20px 0}
.focus-title{font-size:clamp(20px,3vw,26px);font-weight:500;margin:0;max-width:640px;overflow-wrap:anywhere;letter-spacing:-.01em}
.clock{font-family:var(--mono);font-size:clamp(64px,13vw,120px);font-weight:500;letter-spacing:-.05em;line-height:1;margin-top:8px}
.clock.paused{color:var(--muted)}
.clock-state{font-family:var(--mono);font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.clock-state.run{color:var(--accent)}
.focus .btn{padding:8px 18px;font-size:14px}
.focus textarea{max-width:520px;margin-top:18px;background:transparent;min-height:84px}

/* Quests */
.vision{display:grid;gap:8px}
.vision textarea{background:transparent;border-color:var(--line);font-size:15px}
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.chain b{color:var(--fg);font-weight:500}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.stats>div{padding:14px 16px;display:grid;gap:4px;min-width:0}
.stats>div+div{border-left:1px solid var(--line)}
.big{font-size:26px;font-weight:500;letter-spacing:-.02em;line-height:1.1}
.big small{font-size:13px;color:var(--muted);font-weight:400;margin-left:3px}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.qcard{display:grid;gap:12px;align-content:start}
.qhead{display:flex;gap:10px;align-items:flex-start}
.qicon{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:color-mix(in srgb,var(--qc) 16%,transparent);flex:0 0 auto}
.qicon i{width:10px;height:10px;border-radius:50%;background:var(--qc)}
.qhead .grow{flex:1;min-width:0}
.qhead p{margin:2px 0 0;color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.qfig{display:flex;justify-content:space-between;align-items:flex-end;gap:10px}
.spark{width:120px;height:36px;flex:0 0 auto}
.qnew{border:1px dashed var(--line-2);border-radius:12px;display:grid;place-items:center;padding:16px;min-height:150px}
.ms{display:flex;gap:8px;align-items:baseline;padding:3px 0;font-size:13px}
.ms::before{content:'◆';color:var(--accent);font-size:9px}
.ms .t{flex:1;min-width:0;overflow-wrap:anywhere}

/* Review */
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.kpi{display:grid;gap:6px;align-content:start}
.kpi .v{font-size:30px;font-weight:500;letter-spacing:-.03em;line-height:1.05}
.kpi .v.hl{color:var(--accent)}
.kpi .v small{font-size:13px;color:var(--muted);font-weight:400;letter-spacing:0}
.rgrid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:12px}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:170px;margin-top:12px}
.daybar{display:flex;flex-direction:column;justify-content:flex-end;height:100%;gap:5px;text-align:center;min-width:0}
.daybar .b{display:flex;flex-direction:column-reverse;border-radius:5px;overflow:hidden;min-height:2px;background:var(--raised)}
.daybar.today .meta:last-child{color:var(--accent)}
.hbar{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:13px}
.hbar .track{grid-column:1/-1;height:6px;background:var(--raised);border-radius:9px;overflow:hidden}
.hbar .track i{display:block;height:100%;border-radius:9px;background:var(--qc)}
.split{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--raised);margin-top:10px}
.split i{display:block;height:100%}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--mono);font-size:11px}
.chart .grid{stroke:var(--line);stroke-width:1}
.prompts{margin:0;padding-left:18px;color:var(--muted);font-size:13px;display:grid;gap:2px}

/* Overlays */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:flex-start;justify-content:center;padding:10vh max(16px,env(safe-area-inset-right,0px)) 16px max(16px,env(safe-area-inset-left,0px));z-index:20;overflow:auto}
.overlay .card{width:100%;max-width:500px;box-shadow:0 24px 60px rgba(0,0,0,.35)}
.cmd input{border:0;background:none;font-size:16px;width:100%;padding:4px 2px 12px;border-bottom:1px solid var(--line);outline:none}
.cmd-list{max-height:50vh;overflow:auto;margin-top:8px}
.cmd-item{display:flex;justify-content:space-between;gap:10px;padding:8px 10px;border-radius:7px;cursor:pointer}
.cmd-item.sel{background:var(--raised)}
.form{display:grid;gap:12px}
.form label{font-size:12px;color:var(--muted);display:grid;gap:4px}
.form .row label{flex:1;min-width:120px}
.wd{display:flex;gap:4px;flex-wrap:wrap}
.wd label{display:flex;align-items:center;gap:0;flex:0 0 auto;min-width:0}
.wd input{position:absolute;opacity:0;pointer-events:none}
.wd span{display:inline-block;padding:4px 9px;border:1px solid var(--line-2);border-radius:7px;cursor:pointer;font-size:12px;color:var(--muted)}
.wd input:checked+span{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.wd input:focus-visible+span{outline:2px solid var(--accent)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 14px;border-radius:9px;font-size:13px;z-index:30;display:flex;gap:12px;align-items:center;max-width:calc(100% - 32px)}
.toast button{background:none;border:0;color:var(--accent);cursor:pointer;font-weight:600}

.mobile-nav{display:none}
@media (max-width:860px){
  .shell{grid-template-columns:minmax(0,1fr)}
  aside{display:none}
  .grid2,.rgrid{grid-template-columns:minmax(0,1fr)}
  .mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--panel);border-top:1px solid var(--line);z-index:15;padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .mobile-nav button{flex:1;border:0;background:none;padding:8px 0;font-size:11.5px;color:var(--muted);border-radius:7px;min-width:0}
  .mobile-nav button.on{color:var(--fg);background:var(--raised)}
  .kpi .v{font-size:22px}
  .stats .big{font-size:20px}
  .addline select{max-width:45%}
}
@media (max-width:520px){.kpis{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.kpis .kpi:first-child{grid-column:1/-1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="shell">
  <aside id="side"></aside>
  <main id="app"></main>
</div>
<nav class="mobile-nav" id="mnav"></nav>
<div id="modal"></div>
<div id="toastBox"></div>

<script>
// ================= Zustand =================
const COLORS=['#a78bfa','#f59e6b','#8fcf6a','#60a5fa','#f472b6','#2dd4bf','#e8c547','#a8a29e'];
const LS='quest-app-v1', UIKEY='quest-ui-v1';
const VIEWS={heute:'Heute',plan:'Plan',kalender:'Kalender',fokus:'Fokus',quests:'Quests',review:'Review'};
const VKEYS={heute:'1',plan:'2',kalender:'3',fokus:'F',quests:'4',review:'5'};
const WD=['Mo','Di','Mi','Do','Fr','Sa','So'];
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
const blankSettings=()=>({theme:'auto',weeklyTarget:20,vision:''});
const blank=()=>({v:2,quests:[],tasks:[],milestones:[],sessions:[],recurring:[],running:null,reviews:{},settings:blankSettings(),updatedAt:0});

function fix(n){
  n.settings=Object.assign(blankSettings(),n.settings||{});
  for(const k of ['quests','tasks','milestones','sessions','recurring'])if(!Array.isArray(n[k]))n[k]=[];
  if(!n.reviews||typeof n.reviews!=='object')n.reviews={};
  n.sessions.forEach(s=>{if(!s.id)s.id=uid()});
  return n;
}
function migrate(o){
  if(!o||typeof o!=='object')return blank();
  if(o.v===2)return fix(Object.assign(blank(),o));
  // Version 1 → 2
  const n=blank();n.updatedAt=o.updatedAt||0;
  n.quests=(o.quests||[]).map(q=>({id:q.id,title:q.title,color:q.color||COLORS[0],archived:!!q.archived}));
  for(const g of (o.goals||[])){if(!(o.quests||[]).some(q=>q.goalId===g.id))n.quests.push({id:g.id,title:g.title,color:COLORS[n.quests.length%COLORS.length],archived:false})}
  const tk=dayKey(Date.now());
  n.tasks=(o.tasks||[]).map((t,i)=>({id:t.id,title:t.title,questId:t.questId||null,day:tk,order:i,seconds:t.seconds||0,doneAt:null}));
  for(const d of (o.done||[]))n.tasks.push({id:d.id,title:d.title,questId:d.questId||null,day:dayKey(d.doneAt),order:999,seconds:d.seconds||0,doneAt:d.doneAt});
  n.sessions=(o.sessions||[]).map(s=>({q:s.q||null,t:null,s:s.s,e:s.e}));
  n.running=o.running||null;
  return fix(n);
}
let S=blank();
try{const raw=localStorage.getItem(LS);if(raw)S=migrate(JSON.parse(raw))}catch(e){}
let ui={othersOpen:false,calMode:'tag'};
try{Object.assign(ui,JSON.parse(localStorage.getItem(UIKEY)||'{}'))}catch(e){}
const saveUi=()=>{try{localStorage.setItem(UIKEY,JSON.stringify(ui))}catch(e){}};

const hashView=()=>{const h=location.hash.slice(1);return h==='woche'?'plan':(VIEWS[h]?h:null)};
let view=hashView()||'heute';
let focusId=null, weekOffset=0, reviewOffset=0, calDay=null;
const openQuests=new Set();

// ================= Helfer =================
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function dayKey(t){const d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
const keyToDate=k=>{const [y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const today=()=>dayKey(Date.now());
const addDays=(k,n)=>{const d=keyToDate(k);d.setDate(d.getDate()+n);return dayKey(d)};
const wdIdx=k=>(keyToDate(k).getDay()+6)%7;
function weekStart(offset=0,from){const d=from?keyToDate(from):new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7)+offset*7);return dayKey(d)}
const weekDays=ws=>[0,1,2,3,4,5,6].map(i=>addDays(ws,i));
const fmtH=sec=>{sec=Math.max(0,Math.round(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60);return h?`${h}h ${String(m).padStart(2,'0')}m`:`${m}m`};
const fmtDec=sec=>(sec/3600).toLocaleString('de-DE',{maximumFractionDigits:1});
const fmtClock=sec=>{sec=Math.max(0,Math.floor(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return (h?h+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')};
const fmtTime=ms=>{const d=new Date(ms);return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
const fmtDayLong=k=>keyToDate(k).toLocaleDateString('de-DE',{weekday:'long',day:'numeric',month:'long'});
const fmtDM=k=>keyToDate(k).toLocaleDateString('de-DE',{day:'numeric',month:'short'});
const quest=id=>S.quests.find(q=>q.id===id);
const task=id=>S.tasks.find(t=>t.id===id);
const qColor=id=>id?(quest(id)?.color||'#a8a29e'):'var(--other)';
const qName=id=>id?(quest(id)?.title||'Gelöschte Quest'):'Andere';
const activeQuests=()=>S.quests.filter(q=>!q.archived);
const pill=id=>`<span class="pill" style="--qc:${qColor(id)}">${esc(qName(id))}</span>`;
const CHECK='<svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5"/></svg>';
const CHEV='<svg viewBox="0 0 10 10"><path d="M3 1.5L6.5 5 3 8.5" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>';
const target=()=>Math.max(0,+S.settings.weeklyTarget||0)*3600;

function taskSec(t){let s=t.seconds||0;if(S.running&&S.running.taskId===t.id)s+=(Date.now()-S.running.startedAt)/1000;return s}
function sessionsBetween(a,b){
  const out=S.sessions.filter(s=>s.s>=a&&s.s<b).map(s=>({...s,sec:(s.e-s.s)/1000}));
  if(S.running&&S.running.startedAt>=a&&S.running.startedAt<b){const t=task(S.running.taskId);const now=Date.now();out.push({id:'run',q:t?t.questId:null,t:S.running.taskId,s:S.running.startedAt,e:now,sec:(now-S.running.startedAt)/1000,running:true})}
  return out;
}
const dayRange=k=>[keyToDate(k).getTime(),keyToDate(addDays(k,1)).getTime()];
const weekRange=ws=>[keyToDate(ws).getTime(),keyToDate(addDays(ws,7)).getTime()];
function byQuest(list){const m={};for(const s of list)if(s.q)m[s.q]=(m[s.q]||0)+s.sec;return m}
const sum=list=>list.reduce((a,s)=>a+s.sec,0);
const qsum=list=>list.reduce((a,s)=>a+(s.q?s.sec:0),0);
const weekQuestSec=ws=>qsum(sessionsBetween(...weekRange(ws)));
function dayTasks(k){return S.tasks.filter(t=>t.day===k).sort((a,b)=>(!!a.doneAt-!!b.doneAt)||(a.doneAt&&b.doneAt?a.doneAt-b.doneAt:a.order-b.order))}
function openDay(k){return S.tasks.filter(t=>t.day===k&&!t.doneAt).sort((a,b)=>a.order-b.order)}
const overdue=()=>S.tasks.filter(t=>!t.doneAt&&t.day&&t.day<today()).sort((a,b)=>a.day<b.day?-1:a.day>b.day?1:a.order-b.order);
const backlog=()=>S.tasks.filter(t=>!t.doneAt&&!t.day).sort((a,b)=>a.order-b.order);
function queue(){const od=overdue(),o=openDay(today());return [...od.filter(t=>t.questId),...o.filter(t=>t.questId),...od.filter(t=>!t.questId),...o.filter(t=>!t.questId)]}

// ================= Aktionen =================
function save(){S.updatedAt=Date.now();try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}queueRemote()}
function commit(){save();render()}
function stopTimer(){
  if(!S.running)return;
  const t=task(S.running.taskId);const now=Date.now();
  if(t&&now-S.running.startedAt>1500){t.seconds=(t.seconds||0)+(now-S.running.startedAt)/1000;S.sessions.push({id:uid(),q:t.questId||null,t:t.id,s:S.running.startedAt,e:now})}
  S.running=null;
}
function startTimer(id){stopTimer();S.running={taskId:id,startedAt:Date.now()}}
function nextOrder(day){const l=S.tasks.filter(t=>t.day===day&&!t.doneAt);return l.length?Math.max(...l.map(t=>t.order))+1:0}
function addTask(title,questId,day,front){
  title=(title||'').trim();if(!title)return null;
  const t={id:uid(),title,questId:questId||null,day:day===undefined?today():day,order:0,seconds:0,doneAt:null,notes:''};
  if(front){S.tasks.filter(x=>x.day===t.day&&!x.doneAt).forEach(x=>x.order++);t.order=0}else t.order=nextOrder(t.day);
  S.tasks.push(t);commit();return t;
}
function completeTask(id,animEl){
  const t=task(id);if(!t||t.doneAt)return;
  const doIt=()=>{if(S.running&&S.running.taskId===id)stopTimer();t.doneAt=Date.now();if(!t.day||t.day>today())t.day=today();if(focusId===id)focusId=null;commit();toast(`„${t.title}“ erledigt`,()=>{t.doneAt=null;commit()})};
  if(animEl){animEl.classList.add('completing');setTimeout(doIt,700)}else doIt();
}
function uncomplete(id){const t=task(id);if(!t)return;t.doneAt=null;t.order=nextOrder(t.day);commit()}
function moveTask(id,day,beforeId){
  const t=task(id);if(!t)return;
  t.day=day;
  const list=S.tasks.filter(x=>x.day===day&&!x.doneAt&&x.id!==id).sort((a,b)=>a.order-b.order);
  let i=beforeId?list.findIndex(x=>x.id===beforeId):-1;if(i<0)i=list.length;
  list.splice(i,0,t);list.forEach((x,j)=>x.order=j);commit();
}
function delTask(id){const t=task(id);if(!t)return;if(S.running&&S.running.taskId===id)S.running=null;S.tasks=S.tasks.filter(x=>x.id!==id);commit();toast('Aufgabe gelöscht',()=>{S.tasks.push(t);commit()})}
function focusTask(id){focusId=id;go('fokus')}
function go(v){view=v;if(location.hash.slice(1)!==v)location.hash=v;render();window.scrollTo(0,0)}
function newQuest(title){title=(title||'').trim();if(!title)return;const used=S.quests.map(q=>q.color);const q={id:uid(),title,desc:'',target:0,color:COLORS.find(c=>!used.includes(c))||COLORS[S.quests.length%COLORS.length],archived:false};S.quests.push(q);commit();return q}
// Wiederkehrende Aufgaben für sichtbare Tage anlegen (nur heute und später)
function ensureRecurring(days){
  let changed=false;const k=today();
  for(const r of S.recurring){r.made=r.made||{};
    for(const d of days){if(d<k||r.made[d]||!(r.days||[]).includes(wdIdx(d)))continue;
      r.made[d]=true;S.tasks.push({id:uid(),title:r.title,questId:r.questId||null,day:d,order:nextOrder(d),seconds:0,doneAt:null,notes:'',recurId:r.id});changed=true}}
  return changed;
}

let toastTimer;
function toast(msg,undo){
  $('#toastBox').innerHTML=`<div class="toast" role="status"><span>${esc(msg)}</span>${undo?'<button id="undoBtn">Rückgängig</button>':''}</div>`;
  if(undo)$('#undoBtn').onclick=()=>{undo();$('#toastBox').innerHTML=''};
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toastBox').innerHTML='',4500);
}

// ================= Theme =================
function applyTheme(){const t=S.settings.theme||'auto';if(t==='auto')delete document.documentElement.dataset.theme;else document.documentElement.dataset.theme=t}

}

  </div>`;
}

function taskRow(t,opts={}){
  const run=S.running&&S.running.taskId===t.id;const sec=taskSec(t);
  return `<div class="task ${t.doneAt?'done':''} ${opts.first?'first':''}" draggable="${t.doneAt?'false':'true'}" data-id="${t.id}" data-day="${t.day||''}">
    <button class="check ${t.doneAt?'on':''}" data-check="${t.id}" aria-label="${t.doneAt?'Wieder öffnen':'Als erledigt markieren'}">${CHECK}</button>
    <span class="body" data-edit="${t.id}">${opts.first?'<span class="label" style="color:var(--accent)">Jetzt dran</span>':''}<span class="t">${esc(t.title)}</span>${opts.pill!==false?`<span>${pill(t.questId)}</span>`:''}</span>
    <span class="meta" ${run?`data-live-task="${t.id}" style="color:var(--accent)"`:''}>${sec>=30||run?fmtH(sec):''}</span>
    ${t.doneAt?'':`<span class="acts">${opts.today?'':`<button class="btn sm ghost" data-today="${t.id}">Heute</button>`}<button class="btn sm ghost" data-focus="${t.id}">Fokus</button></span>`}
  </div>`;
}

function vHeute(){
  const k=today();const open=openDay(k);const qOpen=open.filter(t=>t.questId),oOpen=open.filter(t=>!t.questId);
  const od=overdue();
  const done=S.tasks.filter(t=>t.doneAt&&dayKey(t.doneAt)===k).sort((a,b)=>a.doneAt-b.doneAt);
  const daySes=sessionsBetween(...dayRange(k));const m=byQuest(daySes);const qd=qsum(daySes);const other=sum(daySes)-qd;
  const wq=weekQuestSec(weekStart());const tg=target();
  const h=new Date().getHours();const greet=h<11?'Guten Morgen':h<18?'Guten Tag':'Guten Abend';
  const first=queue()[0];
  return `<div class="top"><div><div class="label">${fmtDayLong(k)}</div><h1>${greet}. Was bringt deine Quests heute voran?</h1></div></div>

          ${qOpen.length?qOpen.map((t,i)=>taskRow(t,{first:i===0&&!od.some(x=>x.questId),today:true})).join(''):`<div class="empty">Leg die Aufgabe, die eine Quest am weitesten bringt, ganz nach oben.</div>`}
        </div>
        <form class="addline" id="addToday"><input class="field" id="addTitle" placeholder="Aufgabe für heute …" autocomplete="off"><select class="field" id="addQuest" aria-label="Quest">${questOptions(lastQuest)}</select><button class="btn accent" aria-label="Hinzufügen">+</button></form>
        <div style="margin-top:14px;border-top:1px solid var(--line);padding-top:8px">
          <button class="fold ${ui.othersOpen?'open':''}" id="foldOthers">${CHEV}<span class="label">Andere Aufgaben · ${oOpen.length}</span><span class="meta" style="margin-left:6px">erst wenn die Quest-Arbeit steht</span></button>
          ${ui.othersOpen?`<div class="tlist" data-drop-day="${k}" style="margin-top:6px">${oOpen.map(t=>taskRow(t,{today:true,pill:false})).join('')||'<div class="empty">Keine.</div>'}</div>`:''}
        </div>
      </div>
      <div class="card">
        <div class="row between" style="margin-bottom:8px"><span class="label">Geschafft heute · ${done.length}</span><span class="meta">${fmtH(qd)} Quest · ${fmtH(other)} andere</span></div>
        <div class="tlist">${done.map(t=>taskRow(t)).join('')||'<div class="empty">Hier landet alles, was du heute abhakst.</div>'}</div>
      </div>
    </div>
    <div class="stack">
      <div class="card" style="display:grid;gap:12px">
        <div class="label">Quest-Stunden heute</div>
        <div class="big num" data-live-today>${fmtH(qd)}</div>
        ${Object.keys(m).length?`<div class="tlist">${Object.entries(m).sort((a,b)=>b[1]-a[1]).map(([q,s])=>`<div class="row" style="font-size:13px"><span class="dot" style="--qc:${qColor(q)}"></span><span style="flex:1">${esc(qName(q))}</span><span class="meta">${fmtH(s)}</span></div>`).join('')}</div>`:'<div class="muted" style="font-size:13px">Starte den Fokus-Timer, dann wird jede Minute deiner Quest gutgeschrieben.</div>'}
        ${first?`<button class="btn accent" data-focus="${first.id}" style="padding:9px">Fokus starten · ${esc(first.title.length>28?first.title.slice(0,27)+'…':first.title)}</button>`:''}
      </div>
      <div class="card" style="display:grid;gap:10px">
        <div class="row between"><span class="label">Wochenziel</span><span class="meta">${fmtH(wq)} von ${fmtDec(tg)}h</span></div>
        <div class="prog"><i style="width:${tg?Math.min(100,wq/tg*100):0}%"></i></div>
        <div class="muted" style="font-size:12.5px">Gemessen wird Zeit, die in Quest-Aufgaben geflossen ist, kein Ergebnis.</div>
      </div>
      <div class="card" style="display:grid;gap:8px">
        <div class="label">Deine Quests</div>
        ${activeQuests().map(q=>{const n=S.tasks.filter(t=>t.questId===q.id&&!t.doneAt).length;return `<div class="row" style="font-size:13px"><span class="dot" style="--qc:${q.color}"></span><span style="flex:1;min-width:0">${esc(q.title)}</span><span class="meta">${n} offen</span></div>`}).join('')||'<div class="muted" style="font-size:13px">Eine Quest ist ein großes Ziel für dieses Quartal oder Jahr, zum Beispiel „Bachelorarbeit abgeben“.</div>'}
        <form class="addline" id="sideNewQuest" style="margin-top:4px"><input class="field" id="sideNewQuestIn" placeholder="Neue Quest …" autocomplete="off"><button class="btn" aria-label="Quest anlegen">+</button></form>

}
let lastQuest='';
function questOptions(sel){return `<option value="">Andere (ohne Quest)</option>`+activeQuests().map(q=>`<option value="${q.id}" ${q.id===sel?'selected':''}>${esc(q.title)}</option>`).join('')}

function planCard(t){

  return `<div class="pcard ${t.doneAt?'done':''}" style="--qc:${t.questId?qColor(t.questId):'transparent'}" draggable="${t.doneAt?'false':'true'}" data-id="${t.id}" data-day="${t.day||''}">

function vPlan(){
  const ws=weekStart(weekOffset);const days=weekDays(ws);const k=today();const we=addDays(ws,6);

  </div>`;

// ----- Kalender: Logbuch der tatsächlich gearbeiteten Zeit
function timeline(days){
  const per=days.map(d=>sessionsBetween(...dayRange(d)));
  let h0=8,h1=20;
  per.forEach((list,i)=>{const base=keyToDate(days[i]).getTime();list.forEach(s=>{const a=(s.s-base)/3600000,b=(s.e-base)/3600000;h0=Math.min(h0,Math.floor(a));h1=Math.max(h1,Math.ceil(b))})});
  if(days.includes(today())){const nh=new Date().getHours();h0=Math.min(h0,nh);h1=Math.max(h1,nh+1)}
  h0=Math.max(0,h0);h1=Math.min(24,h1);
  const pph=days.length>1?38:56;const H=(h1-h0)*pph;
  const cols=`44px repeat(${days.length},minmax(${days.length>1?'110px':'0'},1fr))`;
  const head=days.length>1?`<div></div>${days.map((d,i)=>`<div class="tl-head"><b style="${d===today()?'color:var(--accent)':''}">${keyToDate(d).toLocaleDateString('de-DE',{weekday:'short',day:'numeric'})}</b><span class="meta">${fmtH(qsum(per[i]))}</span></div>`).join('')}`:'';
  const hours=[];for(let h=h0;h<=h1;h++)hours.push(`<span style="top:${(h-h0)*pph}px">${String(h).padStart(2,'0')}:00</span>`);
  const colHtml=days.map((d,i)=>{const base=keyToDate(d).getTime();
    const blocks=per[i].map(s=>{const top=((s.s-base)/3600000-h0)*pph;const hgt=Math.max(4,s.sec/3600*pph);const t=task(s.t);const ttl=t?t.title:qName(s.q);
      return `<button class="blk ${s.running?'run':''}" ${s.running?'':`data-sess="${s.id}"`} style="top:${top}px;height:${Math.min(hgt,H-top)}px;--qc:${qColor(s.q)}" title="${esc(ttl)} · ${fmtTime(s.s)}–${fmtTime(s.e)}">${hgt>=20?`<b>${esc(ttl)}</b>`:''}${hgt>=34?`<span>${fmtTime(s.s)}–${s.running?'läuft':fmtTime(s.e)}</span>`:''}</button>`}).join('');
    const now=d===today()?`<div class="now" style="top:${((Date.now()-base)/3600000-h0)*pph}px"></div>`:'';
    return `<div class="tl-col" style="height:${H}px;--pph:${pph}px">${blocks}${now}</div>`}).join('');

function weekSeries(n,offset,filter){const out=[];for(let i=n-1;i>=0;i--){const ws=weekStart(offset-i);const l=sessionsBetween(...weekRange(ws));out.push({ws,sec:filter?l.filter(filter).reduce((a,s)=>a+s.sec,0):qsum(l)})}return out}
function sparkline(vals,color){
  const W=120,H=36,max=Math.max(1,...vals);const step=W/(vals.length-1);
  const pts=vals.map((v,i)=>[i*step,H-3-(v/max)*(H-8)]);
  const line=pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
  const last=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polygon points="0,${H} ${line} ${W},${H}" fill="${color}" opacity=".12"/><polyline points="${line}" fill="none" stroke="${color}" stroke-width="1.6" stroke-linejoin="round"/><circle cx="${last[0]-1.5}" cy="${last[1]}" r="2.6" fill="${color}"/></svg>`;
}

function niceStep(x){const p=Math.pow(10,Math.floor(Math.log10(x||1)));const f=x/p;return (f<=1?1:f<=2?2:f<=5?5:10)*p}
function weeksChart(series,tgSec){
  const W=640,H=210,L=34,R=10,T=14,B=26;const vals=series.map(s=>s.sec/3600);
  const avg=vals.map((_,i)=>{const sl=vals.slice(Math.max(0,i-3),i+1);return sl.reduce((a,b)=>a+b,0)/sl.length});
  const tg=tgSec/3600;const maxV=Math.max(1,...vals,...avg,tg)*1.1;const step=niceStep(maxV/4);const top=Math.ceil(maxV/step)*step;
  const y=v=>T+(H-T-B)*(1-v/top);const bw=(W-L-R)/vals.length;
  let g='';for(let v=0;v<=top+1e-9;v+=step)g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${v}</text>`;
  const bars=vals.map((v,i)=>{const x=L+i*bw+bw*.2,w=bw*.6;const cur=i===vals.length-1;return `<rect x="${x}" y="${y(v)}" width="${w}" height="${Math.max(0,y(0)-y(v))}" rx="3" fill="${cur?'var(--accent)':'var(--line-2)'}"/><text x="${x+w/2}" y="${H-8}" text-anchor="middle">${fmtDM(series[i].ws).replace('.','')}</text>`}).join('');
  const pts=avg.map((v,i)=>`${L+i*bw+bw/2},${y(v)}`).join(' ');
  const tline=tg?`<line x1="${L}" x2="${W-R}" y1="${y(tg)}" y2="${y(tg)}" stroke="var(--accent)" stroke-dasharray="4 4" opacity=".6"/><text x="${L+4}" y="${y(tg)-5}">Ziel ${fmtDec(tgSec)}h</text>`:'';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Quest-Stunden der letzten ${vals.length} Wochen">${g}${tline}${bars}<polyline points="${pts}" fill="none" stroke="var(--fg)" stroke-width="1.5" opacity=".75"/>${avg.map((v,i)=>`<circle cx="${L+i*bw+bw/2}" cy="${y(v)}" r="${i===avg.length-1?3.5:2}" fill="var(--fg)"/>`).join('')}</svg>`;
}
function vReview(){
  const ws=weekStart(reviewOffset);const days=weekDays(ws);const k=today();
  const cur=sessionsBetween(...weekRange(ws));const prev=sessionsBetween(...weekRange(weekStart(reviewOffset-1)));
  const q=qsum(cur),all=sum(cur),other=all-q,qp=qsum(prev);const tg=target();
  const elapsed=reviewOffset===0?wdIdx(k)+1:reviewOffset<0?7:0;
  const avg=elapsed?q/elapsed:0;
  const m=byQuest(cur);const keys=Object.keys(m).sort((a,b)=>m[b]-m[a]);const mmax=Math.max(1,...Object.values(m));
  const daySec=days.map(d=>byQuest(sessionsBetween(...dayRange(d))));const dtot=daySec.map(o=>Object.values(o).reduce((a,b)=>a+b,0));const dmax=Math.max(1,...dtot);
  const [a,b]=weekRange(ws);const doneN=S.tasks.filter(t=>t.doneAt>=a&&t.doneAt<b).length;
  const ms=S.milestones.filter(x=>{const d=keyToDate(x.date).getTime();return d>=a&&d<b});
  const d=q-qp;
  return `<div class="top"><div><div class="label">Wochen-Review · ${fmtDM(ws)} – ${fmtDM(addDays(ws,6))}</div><h1>Wie viel hat die Woche deine Quests vorangebracht?</h1></div>
    <div class="row"><button class="btn sm ghost" data-rv="-1" aria-label="Vorige Woche">←</button><button class="btn sm" data-rv="0">Diese Woche</button><button class="btn sm ghost" data-rv="1" aria-label="Nächste Woche">→</button></div></div>
  <div class="kpis">

    <div class="card kpi"><span class="label">Ø pro Tag</span><span class="v num">${fmtH(avg)}</span><span class="meta">über ${elapsed||0} ${elapsed===1?'Tag':'Tage'}</span></div>
    <div class="card kpi"><span class="label">Quest-Anteil</span><span class="v num">${all?Math.round(q/all*100):0}<small> %</small></span><span class="meta">${doneN} erledigt · ${ms.length} Meilensteine</span></div>
  </div>
  <div class="rgrid">
    <div class="card"><div class="label">Quest-Stunden pro Tag</div>
      <div class="days">${days.map((dd,i)=>`<div class="daybar ${dd===k?'today':''}"><span class="meta">${dtot[i]?fmtH(dtot[i]):''}</span><div class="b" style="height:${dtot[i]/dmax*100}%">${Object.entries(daySec[i]).map(([qq,s])=>`<i style="display:block;height:${s/Math.max(dtot[i],1)*100}%;background:${qColor(qq)}"></i>`).join('')}</div><span class="meta">${WD[i]}</span></div>`).join('')}</div>
    </div>
    <div class="stack">
      <div class="card" style="display:grid;gap:12px"><div class="label">Stunden pro Quest</div>
        ${keys.length?keys.map(kk=>`<div class="hbar" style="--qc:${qColor(kk)}"><span class="row" style="gap:7px;flex-wrap:nowrap;min-width:0"><span class="dot"></span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(qName(kk))}</span></span><span class="meta">${fmtH(m[kk])}</span><span class="track"><i style="width:${m[kk]/mmax*100}%"></i></span></div>`).join(''):'<div class="empty">Noch keine Quest-Zeit in dieser Woche.</div>'}
      </div>
      <div class="card"><div class="row between"><span class="label">Quest-Arbeit gegen Andere</span><span class="meta">${fmtH(q)} · ${fmtH(other)}</span></div>
        <div class="split">${all?`<i style="width:${q/all*100}%;background:var(--accent)"></i><i style="width:${other/all*100}%;background:var(--other)"></i>`:''}</div>
      </div>
    </div>
  </div>
  <div class="card"><div class="row between" style="margin-bottom:8px"><span class="label">Quest-Stunden · letzte 8 Wochen</span><span class="meta">Linie = Durchschnitt der letzten 4 Wochen</span></div>${weeksChart(weekSeries(8,reviewOffset),tg)}</div>
  ${ms.length?`<div class="card"><div class="label" style="margin-bottom:6px">Erreichte Meilensteine</div>${ms.map(x=>`<div class="ms"><span class="t">${esc(x.title)}</span><span class="meta">${esc(qName(x.questId))}</span></div>`).join('')}</div>`:''}
  <div class="card" style="display:grid;gap:10px"><div class="label">Reflexion</div>
    <ul class="prompts"><li>Was ist gut gelaufen, was schlecht, und warum?</li><li>Passen meine Tage zu meinen Quests, oder muss ich Ziele oder Alltag ändern?</li><li>Was ändere ich nächste Woche konkret?</li></ul>
    <textarea class="field" id="reviewNote" rows="5" placeholder="Notizen zur Woche …">${esc(S.reviews[ws]||'')}</textarea>
    <div class="row"><button class="btn" id="saveReview">Speichern</button><span class="meta" id="rvSaved"></span></div>
  </div>`;

let dragId=null,notesTimer=null;

  on('[data-addms]','submit',e=>{e.preventDefault();const v=e.currentTarget.querySelector('input').value.trim();if(!v)return;S.milestones.push({id:uid(),questId:e.currentTarget.dataset.addms,title:v,date:today()});commit();toast('Meilenstein erreicht ◆')});
  on('[data-delms]','click',e=>{S.milestones=S.milestones.filter(m=>m.id!==e.currentTarget.dataset.delms);commit()});

  on('.task,.pcard','dragover',e=>{if(!dragId||e.currentTarget.classList.contains('done'))return;e.preventDefault();e.stopPropagation();document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));e.currentTarget.classList.add('drag-over')});
  on('.task,.pcard','drop',e=>{if(!dragId)return;e.preventDefault();e.stopPropagation();const tgt=e.currentTarget;if(tgt.dataset.id===dragId||tgt.classList.contains('done'))return;moveTask(dragId,tgt.dataset.day||null,tgt.dataset.id)});
  on('[data-drop-day]','dragover',e=>{if(!dragId)return;e.preventDefault();document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));e.currentTarget.classList.add('drag-over')});
  on('[data-drop-day]','dragleave',e=>{if(!e.currentTarget.contains(e.relatedTarget))e.currentTarget.classList.remove('drag-over')});
  on('[data-drop-day]','drop',e=>{if(!dragId)return;e.preventDefault();moveTask(dragId,e.currentTarget.dataset.dropDay||null)});
}
function toggleTimer(){const t=currentFocus();if(!t)return;if(S.running&&S.running.taskId===t.id)stopTimer();else startTimer(t.id);commit()}
function focusDone(){
  const t=currentFocus();if(!t)return;
  const btn=$('#fdone');if(btn){btn.textContent='✓';btn.style.background='var(--good)';btn.style.borderColor='var(--good)';btn.style.color='var(--bg)'}
  setTimeout(()=>{completeTask(t.id);focusId=null;render()},400);
}

// ================= Dialoge =================
function closeModal(){$('#modal').innerHTML=''}
const modalOpen=()=>!!$('#modal').innerHTML;
function modal(html){$('#modal').innerHTML=`<div class="overlay" id="ov">${html}</div>`;$('#ov').onclick=e=>{if(e.target.id==='ov')closeModal()}}
function dayOptions(sel){
  const k=today();const opts=[['','Backlog (ohne Tag)'],[k,'Heute'],[addDays(k,1),'Morgen']];
  for(let i=2;i<7;i++)opts.push([addDays(k,i),fmtDayLong(addDays(k,i))]);
  if(sel&&!opts.some(o=>o[0]===sel))opts.push([sel,fmtDayLong(sel)]);
  return opts.map(([v,l])=>`<option value="${v}" ${v===(sel||'')?'selected':''}>${l}</option>`).join('');
}
function quickAdd(){
  modal(`<form class="card form" id="qa"><div class="label">Neue Aufgabe</div>
    <input class="field" id="qaT" placeholder="Was ist zu tun?" autocomplete="off" style="font-size:16px">
    <div class="row"><label>Quest<select class="field" id="qaQ">${questOptions(lastQuest)}</select></label><label>Tag<select class="field" id="qaD">${dayOptions(today())}</select></label></div>
    <label class="row" style="color:var(--fg);font-size:13px;display:flex"><input type="checkbox" id="qaF"> Ganz nach oben setzen</label>
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn ghost" id="qaC">Abbrechen</button><button class="btn accent">Anlegen</button></div></form>`);
  $('#qaC').onclick=closeModal;
  $('#qa').onsubmit=e=>{e.preventDefault();lastQuest=$('#qaQ').value;const d=$('#qaD').value||null;const f=$('#qaF').checked;const t=$('#qaT').value;closeModal();if(addTask(t,lastQuest,d,f))toast('Aufgabe angelegt')};
  setTimeout(()=>$('#qaT').focus(),0);
}
function editTask(id){
  const t=task(id);if(!t)return;
  modal(`<form class="card form" id="et"><div class="label">Aufgabe</div>
    <input class="field" id="etT" value="${esc(t.title)}" style="font-size:16px" aria-label="Titel">
    <div class="row"><label>Quest<select class="field" id="etQ">${questOptions(t.questId)}</select></label><label>Tag<select class="field" id="etD">${dayOptions(t.day)}</select></label></div>
    <label>Notizen<textarea class="field" id="etN" rows="3">${esc(t.notes||'')}</textarea></label>
    <div class="meta">Erfasste Zeit: ${fmtH(taskSec(t))}${t.doneAt?' · erledigt am '+new Date(t.doneAt).toLocaleDateString('de-DE'):''}</div>
    <div class="row between"><button type="button" class="btn ghost danger" id="etDel">Löschen</button>
    <span class="row">${t.doneAt?'':`<button type="button" class="btn" id="etF">Fokus</button>`}<button class="btn accent">Speichern</button></span></div></form>`);
  $('#etDel').onclick=()=>{closeModal();delTask(id)};
  const ef=$('#etF');if(ef)ef.onclick=()=>{closeModal();focusTask(id)};
  $('#et').onsubmit=e=>{e.preventDefault();const v=$('#etT').value.trim();if(v)t.title=v;t.notes=$('#etN').value;
    const nq=$('#etQ').value||null;if(t.questId!==nq){t.questId=nq;S.sessions.forEach(s=>{if(s.t===t.id)s.q=nq})}
    const nd=$('#etD').value||null;closeModal();if(nd!==t.day&&!t.doneAt)moveTask(t.id,nd);else commit()};
  setTimeout(()=>$('#etT').focus(),0);
}
function editQuest(id){
  const q=quest(id);if(!q)return;let col=q.color,armed=false;
  modal(`<form class="card form" id="eq"><div class="label">Quest bearbeiten</div>
    <label>Name<input class="field" id="eqT" value="${esc(q.title)}" style="font-size:16px"></label>
    <label>Woran merkst du, dass sie geschafft ist?<input class="field" id="eqDesc" value="${esc(q.desc||'')}" placeholder="z. B. 1 Mio. € Umsatz bis Dezember"></label>
    <label>Wochenziel in Stunden (optional)<input class="field" id="eqTg" type="number" min="0" step="0.5" value="${q.target||''}"></label>
    <div class="row">${COLORS.map(c=>`<button type="button" data-col="${c}" aria-label="Farbe ${c}" style="width:24px;height:24px;border-radius:50%;border:2px solid ${c===col?'var(--fg)':'transparent'};background:${c};cursor:pointer"></button>`).join('')}</div>
    <div class="row between"><span class="row"><button type="button" class="btn ghost" id="eqA">Abschließen</button><button type="button" class="btn ghost danger" id="eqD">Löschen</button></span><button class="btn accent">Speichern</button></div>
    <div class="meta" id="eqW"></div></form>`);
  document.querySelectorAll('[data-col]').forEach(b=>b.onclick=()=>{col=b.dataset.col;document.querySelectorAll('[data-col]').forEach(x=>x.style.borderColor=x.dataset.col===col?'var(--fg)':'transparent')});
  $('#eq').onsubmit=e=>{e.preventDefault();const v=$('#eqT').value.trim();if(v)q.title=v;q.desc=$('#eqDesc').value.trim();q.target=Math.max(0,+$('#eqTg').value||0);q.color=col;closeModal();commit()};
  $('#eqA').onclick=()=>{q.archived=true;closeModal();commit();toast('Quest abgeschlossen',()=>{q.archived=false;commit()})};
  $('#eqD').onclick=()=>{if(!armed){armed=true;$('#eqD').textContent='Wirklich löschen?';$('#eqW').textContent='Aufgaben bleiben erhalten und zählen dann zu „Andere“. Meilensteine werden entfernt.';return}
    S.quests=S.quests.filter(x=>x.id!==id);S.tasks.forEach(t=>{if(t.questId===id)t.questId=null});S.sessions.forEach(s=>{if(s.q===id)s.q=null});S.milestones=S.milestones.filter(m=>m.questId!==id);closeModal();commit()};
}
function openSettings(){
  modal(`<form class="card form" id="st"><div class="label">Einstellungen</div>
    <label>Wochenziel Quest-Stunden<input class="field" id="stTg" type="number" min="0" step="1" value="${S.settings.weeklyTarget}"></label>
    <label>Darstellung<select class="field" id="stTh">${[['auto','Wie das System'],['dark','Dunkel'],['light','Hell']].map(([v,l])=>`<option value="${v}" ${S.settings.theme===v?'selected':''}>${l}</option>`).join('')}</select></label>
    <div style="border-top:1px solid var(--line);padding-top:12px;display:grid;gap:8px">
      <span class="label">Daten mitnehmen</span>
      <span class="muted" style="font-size:12.5px">Kopiert alle Aufgaben, Quests und Zeiten. In der Desktop-App unter Einstellungen einfügen und „Importieren“ klicken.</span>
      <div class="row"><button type="button" class="btn sm" id="stCopy">Alle Daten kopieren</button><span class="meta" id="stMsg"></span></div>
      <textarea class="field" id="stOutTxt" rows="3" hidden readonly aria-label="Daten zum Kopieren"></textarea>
    </div>
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn ghost" id="stC">Abbrechen</button><button class="btn accent">Speichern</button></div></form>`);
  $('#stC').onclick=closeModal;
  $('#st').onsubmit=e=>{e.preventDefault();S.settings.weeklyTarget=Math.max(0,+$('#stTg').value||0);S.settings.theme=$('#stTh').value;closeModal();commit()};
  $('#stCopy').onclick=()=>{const txt=JSON.stringify(S);
    navigator.clipboard.writeText(txt).then(()=>{$('#stMsg').textContent='Kopiert.'},()=>{const ta=$('#stOutTxt');ta.hidden=false;ta.value=txt;ta.select();$('#stMsg').textContent='Text markiert, kopiere ihn mit Strg C.'})};
}
function openRecurring(){
  const list=S.recurring.map(r=>`<div class="row" style="padding:4px 0;flex-wrap:nowrap"><span class="dot" style="--qc:${qColor(r.questId)}"></span><span style="flex:1;min-width:0;overflow-wrap:anywhere">${esc(r.title)}</span><span class="meta">${(r.days||[]).map(i=>WD[i]).join(' ')}</span><button type="button" class="btn sm ghost" data-delrec="${r.id}" aria-label="Entfernen">✕</button></div>`).join('')||'<div class="muted" style="font-size:13px">Noch keine. Zum Beispiel „Morning Check-in“ jeden Werktag oder „Weekly Planning“ am Montag.</div>';
  modal(`<form class="card form" id="rc"><div class="label">Wiederkehrende Aufgaben</div>
    <div>${list}</div>
    <div style="border-top:1px solid var(--line);padding-top:12px;display:grid;gap:10px">
      <input class="field" id="rcT" placeholder="Neue wiederkehrende Aufgabe …" autocomplete="off" aria-label="Titel">
      <select class="field" id="rcQ" aria-label="Quest">${questOptions()}</select>
      <div class="wd">${WD.map((w,i)=>`<label><input type="checkbox" value="${i}" ${i<5?'checked':''}><span>${w}</span></label>`).join('')}</div>
    </div>
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn ghost" id="rcC">Schließen</button><button class="btn accent">Hinzufügen</button></div>
    <div class="meta">Neue Einträge erscheinen ab heute automatisch an den gewählten Tagen.</div></form>`);
  $('#rcC').onclick=closeModal;
  document.querySelectorAll('[data-delrec]').forEach(b=>b.onclick=()=>{S.recurring=S.recurring.filter(r=>r.id!==b.dataset.delrec);save();render();openRecurring()});
  $('#rc').onsubmit=e=>{e.preventDefault();const t=$('#rcT').value.trim();const days=[...document.querySelectorAll('.wd input:checked')].map(x=>+x.value);if(!t||!days.length)return;
    S.recurring.push({id:uid(),title:t,questId:$('#rcQ').value||null,days,made:{}});save();render();openRecurring();toast('Wiederkehrende Aufgabe angelegt')};
  setTimeout(()=>$('#rcT')?.focus(),0);
}
const toMs=(dk,hm)=>{const [h,m]=(hm||'0:0').split(':').map(Number);const d=keyToDate(dk);d.setHours(h||0,m||0,0,0);return d.getTime()};
function editSession(id){
  const s=S.sessions.find(x=>x.id===id);if(!s)return;const t=task(s.t);const dk=dayKey(s.s);let armed=false;
  modal(`<form class="card form" id="es"><div class="label">Sitzung · ${fmtDayLong(dk)}</div>
    <div style="font-size:15px">${esc(t?t.title:qName(s.q))}</div><div>${pill(s.q)}</div>
    <div class="row"><label>Beginn<input class="field" type="time" id="esA" value="${fmtTime(s.s)}"></label><label>Ende<input class="field" type="time" id="esB" value="${fmtTime(s.e)}"></label></div>
    <div class="meta" id="esW"></div>
    <div class="row between"><button type="button" class="btn ghost danger" id="esD">Löschen</button><span class="row"><button type="button" class="btn ghost" id="esC">Abbrechen</button><button class="btn accent">Speichern</button></span></div></form>`);
  $('#esC').onclick=closeModal;
  $('#esD').onclick=()=>{if(!armed){armed=true;$('#esD').textContent='Wirklich löschen?';return}
    if(t)t.seconds=Math.max(0,(t.seconds||0)-(s.e-s.s)/1000);S.sessions=S.sessions.filter(x=>x.id!==id);closeModal();commit()};
  $('#es').onsubmit=e=>{e.preventDefault();const a=toMs(dk,$('#esA').value),b=toMs(dk,$('#esB').value);if(!(b>a)){$('#esW').textContent='Das Ende muss nach dem Beginn liegen.';return}
    if(t)t.seconds=Math.max(0,(t.seconds||0)+((b-a)-(s.e-s.s))/1000);s.s=a;s.e=b;closeModal();commit()};
}
function addTimeModal(){
  const dk=calDay||today();
  const cands=[...new Map([...S.tasks.filter(t=>t.day===dk||(t.doneAt&&dayKey(t.doneAt)===dk)),...queue(),...backlog()].map(t=>[t.id,t])).values()];
  if(!cands.length){toast('Leg zuerst eine Aufgabe an, dann kannst du Zeit dafür nachtragen.');return}
  const now=new Date();const def=String(Math.max(0,now.getHours()-1)).padStart(2,'0')+':00';
  modal(`<form class="card form" id="at"><div class="label">Zeit nachtragen</div>
    <label>Aufgabe<select class="field" id="atT">${cands.map(t=>`<option value="${t.id}">${esc(t.title)} · ${esc(qName(t.questId))}</option>`).join('')}</select></label>
    <div class="row"><label>Datum<input class="field" type="date" id="atD" value="${dk}"></label><label>Beginn<input class="field" type="time" id="atA" value="${def}"></label><label>Minuten<input class="field" type="number" id="atM" min="1" step="5" value="60"></label></div>
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn ghost" id="atC">Abbrechen</button><button class="btn accent">Eintragen</button></div></form>`);
  $('#atC').onclick=closeModal;
  $('#at').onsubmit=e=>{e.preventDefault();const t=task($('#atT').value);const d=$('#atD').value||dk;const a=toMs(d,$('#atA').value);const mins=Math.max(1,+$('#atM').value||0);if(!t)return;
    S.sessions.push({id:uid(),q:t.questId||null,t:t.id,s:a,e:a+mins*60000});t.seconds=(t.seconds||0)+mins*60;closeModal();commit();toast(`${mins} Minuten eingetragen`)};
}
function pickTask(){
  const list=[...queue(),...backlog()];
  openPalette(list.map(t=>({label:t.title,hint:qName(t.questId),run:()=>focusTask(t.id)})),'Welche Aufgabe willst du fokussieren?');
}
function openPalette(items,ph){
  items=items||[
    {label:'Neue Aufgabe',hint:'N',run:quickAdd},
    {label:'Fokus starten',hint:'F',run:()=>go('fokus')},
    ...Object.entries(VIEWS).filter(([k])=>k!=='fokus').map(([k,l])=>({label:'Gehe zu '+l,hint:VKEYS[k],run:()=>go(k)})),
    {label:'Zeit nachtragen',run:()=>{go('kalender');addTimeModal()}},
    {label:'Wiederkehrende Aufgaben',run:openRecurring},
    {label:'Einstellungen',run:openSettings},
    ...queue().map(t=>({label:'Fokus: '+t.title,hint:qName(t.questId),run:()=>focusTask(t.id)}))
  ];
  let sel=0,filtered=items;
  modal(`<div class="card cmd"><input id="cmdI" placeholder="${esc(ph||'Befehl oder Aufgabe suchen …')}" autocomplete="off" aria-label="Suchen"><div class="cmd-list" id="cmdL"></div></div>`);
  const draw=()=>{$('#cmdL').innerHTML=filtered.map((it,i)=>`<div class="cmd-item ${i===sel?'sel':''}" data-i="${i}"><span>${esc(it.label)}</span><span class="meta">${esc(it.hint||'')}</span></div>`).join('')||'<div class="muted" style="padding:8px 10px">Nichts gefunden.</div>';
    document.querySelectorAll('.cmd-item').forEach(el=>el.onclick=()=>{const it=filtered[+el.dataset.i];closeModal();it.run()});
    document.querySelector('.cmd-item.sel')?.scrollIntoView({block:'nearest'})};
  draw();
  const inp=$('#cmdI');
  inp.oninput=()=>{const q=inp.value.toLowerCase();filtered=items.filter(it=>(it.label+' '+(it.hint||'')).toLowerCase().includes(q));sel=0;draw()};
  inp.onkeydown=e=>{if(e.key==='ArrowDown'){e.preventDefault();sel=Math.min(sel+1,filtered.length-1);draw()}else if(e.key==='ArrowUp'){e.preventDefault();sel=Math.max(sel-1,0);draw()}else if(e.key==='Enter'){e.preventDefault();const it=filtered[sel];if(it){closeModal();it.run()}}};
  setTimeout(()=>inp.focus(),0);
}

// ================= Tastatur =================
document.addEventListener('keydown',e=>{
  const mod=e.metaKey||e.ctrlKey;
  if(mod&&e.key.toLowerCase()==='k'){e.preventDefault();modalOpen()?closeModal():openPalette();return}
  if(e.key==='Escape'){if(modalOpen()){closeModal();return}if(view==='fokus'){go('heute');return}}
  if(modalOpen())return;
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'');
  if(mod&&e.key==='Enter'&&view==='fokus'){e.preventDefault();focusDone();return}
  if(typing||mod||e.altKey)return;
  const k=e.key.toLowerCase();
  if(k==='n'){e.preventDefault();quickAdd()}
  else if(k==='f'){e.preventDefault();go('fokus')}
  else if(e.code==='Space'&&view==='fokus'){e.preventDefault();toggleTimer()}
  else{const v=Object.keys(VKEYS).find(x=>VKEYS[x]===e.key);if(v){e.preventDefault();go(v)}}
});
window.addEventListener('hashchange',()=>{const h=hashView();if(h&&h!==view){view=h;render()}});
window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',applyTheme);

// Laufende Anzeigen, nur Darstellung
let tick=0;
setInterval(()=>{
  tick++;
  if(!S.running){document.title='Quest';return}
  const t=task(S.running.taskId);if(!t)return;
  const c=$('#clock');if(c&&focusId===t.id)c.textContent=fmtClock(taskSec(t));
  document.querySelectorAll(`[data-live-task="${t.id}"]`).forEach(el=>el.textContent=fmtH(taskSec(t)));
  const lt=$('[data-live-today]');if(lt)lt.textContent=fmtH(qsum(sessionsBetween(...dayRange(today()))));
  document.title=fmtClock(taskSec(t))+' · '+t.title;
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement?.tagName||'');
  if(tick%30===0&&(view==='kalender'||view==='review')&&!modalOpen()&&!typing&&!dragId)render();
},1000);

// ================= Synchronisierung (privat pro Person) =================
let ref=null,writing=false,dirty=false,flushTimer=null,syncText='Lokal gespeichert';
const setSync=t=>{syncText=t;const el=$('#sync');if(el)el.textContent=t};
function queueRemote(){if(!ref)return;dirty=true;clearTimeout(flushTimer);flushTimer=setTimeout(flush,800)}
async function flush(){
  if(!ref||writing||!dirty)return;writing=true;dirty=false;
  try{await ref.set({state:JSON.stringify(S),updatedAt:S.updatedAt});setSync('Synchronisiert')}
  catch(e){if(e&&e.code==='quota_exceeded')setSync('Speicher voll, nur lokal');else if(e&&e.code==='invalid_argument'){ref=null;setSync('Nur lokal gespeichert')}else{dirty=true;setSync('Sync-Fehler, neuer Versuch …')}}
  writing=false;if(dirty&&ref)flushTimer=setTimeout(flush,1500);
}
(async()=>{
  try{
    if(!window.claude||!claude.use)return;
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    ref=db.doc('data/users/'+id+'/state');
    setSync('Verbinde …');
    let first=true;const to=setTimeout(()=>{if(first)setSync('Sync nicht erreichbar, lokal gespeichert')},10000);
    ref.onSnapshot(snap=>{
      if(snap.metadata.hasPendingWrites)return;
      if(snap.exists){
        const d=snap.data();
        if(d.updatedAt>S.updatedAt){try{S=migrate(JSON.parse(d.state));localStorage.setItem(LS,JSON.stringify(S));const typing=/INPUT|TEXTAREA/.test(document.activeElement?.tagName||'');if(!modalOpen()&&!typing)render()}catch(e){}}
        else if(d.updatedAt<S.updatedAt&&first){dirty=true;flush()}
      }else if(first&&!snap.metadata.fromCache&&S.updatedAt){dirty=true;flush()}
      if(!snap.metadata.fromCache){clearTimeout(to);first=false;setSync('Synchronisiert')}
    },()=>setSync('Sync beendet, lokal gespeichert'));
  }catch(e){}
})();

render();
</script>
